<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <title>Sexta-Feira Studies</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="icon" href="https://i.ibb.co/4nVtZpr2/Gemini-Generated-Image-vrc8thvrc8thvrc8.png">

  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">

  <!-- Font Awesome -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css"/>

  <!-- CSS -->
  <link rel="stylesheet" href="style.css">
</head>

<body>

<!-- TOAST -->
<div id="toast"></div>

<!-- LOGIN -->
<section id="screen-login" class="screen active">
  <div class="login-container">
    <img src="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png" class="logo">
    <h1>Sexta-Feira Studies</h1>
    <p>Estude de forma inteligente e divertida</p>

    <div class="tabs">
      <button id="tab-login">Entrar</button>
      <button id="tab-cadastro">Cadastrar</button>
    </div>

    <!-- LOGIN -->
    <form id="form-login">
      <input type="text" id="login-usuario" placeholder="@usuario">
      <input type="password" id="login-senha" placeholder="Senha">
      <button type="submit">Entrar</button>
      <button type="button" id="btn-google"><i class="fab fa-google"></i> Entrar com Google</button>
    </form>

    <!-- CADASTRO -->
    <form id="form-cadastro" class="hidden">
      <input type="text" id="cadastro-nome" placeholder="Nome">
      <input type="text" id="cadastro-usuario" placeholder="@usuario">
      <input type="email" id="cadastro-email" placeholder="Email">
      <input type="password" id="cadastro-senha" placeholder="Senha">
      <button type="submit">Criar conta</button>
    </form>

    <a href="#" id="link-adm">Painel ADM</a>
  </div>
</section>

<!-- APP -->
<section id="screen-app" class="screen">

  <!-- NAVBAR -->
  <header id="navbar">
    <div class="nav-left">
      <img src="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png">
      <span>SF Studies</span>
    </div>
    <div class="nav-right">
      <button id="btn-busca"><i class="fas fa-search"></i></button>
      <button id="btn-notificacoes">
        <i class="fas fa-bell"></i>
        <span id="notif-badge"></span>
      </button>
      <img id="avatar-navbar" class="avatar">
    </div>
  </header>

  <!-- CONTENTS -->
  <main>

    <div id="content-home" class="content active"></div>
    <div id="content-disciplinas" class="content"></div>
    <div id="content-ranking" class="content"></div>
    <div id="content-desafios" class="content"></div>
    <div id="content-busca" class="content"></div>
    <div id="content-notificacoes" class="content"></div>
    <div id="content-perfil" class="content"></div>
    <div id="content-materia" class="content"></div>
    <div id="content-aula" class="content"></div>
    <div id="content-quiz-play" class="content"></div>
    <div id="content-sobre" class="content"></div>
    <div id="content-updates" class="content"></div>
    <div id="content-agenda" class="content"></div>
    <div id="content-tarefas" class="content"></div>
    <div id="content-criador-pdf" class="content"></div>

    <!-- JARVIS -->
    <div id="content-jarvis" class="content">
      <div id="jarvis-mensagens"></div>
      <div class="jarvis-input-area">
        <input type="file" id="jarvis-upload">
        <div id="jarvis-preview"></div>
        <textarea id="jarvis-texto" placeholder="Digite sua mensagem..."></textarea>
        <button id="jarvis-enviar"><i class="fas fa-paper-plane"></i></button>
      </div>
    </div>

  </main>

  <!-- BOTTOM NAV -->
  <nav id="bottomnav">
    <button data-target="home"><i class="fas fa-home"></i></button>
    <button data-target="disciplinas"><i class="fas fa-book"></i></button>
    <button data-target="desafios"><i class="fas fa-bolt"></i></button>
    <button data-target="ranking"><i class="fas fa-trophy"></i></button>
    <button data-target="jarvis"><img src="https://i.ibb.co/WQpBG05/Gemini-Generated-Image-xwcu3fxwcu3fxwcu.png"></button>
  </nav>

</section>

<!-- ADMIN -->
<section id="screen-adm" class="screen">

  <header class="adm-navbar">
    <h2>Painel Admin</h2>
  </header>

  <div id="adm-login">
    <input type="password" id="adm-senha" placeholder="Senha admin">
    <button id="adm-entrar">Acessar</button>
  </div>

  <div id="adm-panel" class="hidden">
    <div class="adm-tabs">
      <button>Dashboard</button>
      <button>Usuários</button>
      <button>Disciplinas</button>
      <button>Quizzes</button>
      <button>Aulas</button>
      <button>Posts</button>
      <button>Desafios</button>
      <button>Sobre</button>
      <button>Updates</button>
    </div>
    <div id="adm-content"></div>
  </div>

</section>

<!-- MODAIS -->

<div id="modal-disciplina" class="modal-overlay">
  <div class="modal">
    <input type="text" placeholder="Ícone">
    <input type="text" placeholder="Nome">
    <textarea placeholder="Descrição"></textarea>
    <button>Cancelar</button>
    <button>Criar</button>
  </div>
</div>

<div id="modal-aula" class="modal-overlay">
  <div class="modal">
    <input type="text" placeholder="Título">
    <textarea placeholder="Conteúdo"></textarea>
    <button>Cancelar</button>
    <button>Criar</button>
  </div>
</div>

<div id="modal-quiz" class="modal-overlay">
  <div class="modal">
    <input type="text" placeholder="Nome">
    <input type="number" placeholder="Tempo">
    <div id="quiz-questoes"></div>
    <button id="add-questao">+ Questão</button>
    <button>Cancelar</button>
    <button>Criar</button>
  </div>
</div>

<div id="modal-post" class="modal-overlay">
  <div class="modal">
    <textarea placeholder="Texto"></textarea>
    <input type="file">
    <div class="preview"></div>
    <button>Cancelar</button>
    <button>Postar</button>
  </div>
</div>

<div id="modal-comentarios" class="modal-overlay">
  <div class="modal">
    <div id="comentarios-lista"></div>
    <input type="text" placeholder="Comentário">
    <button>Enviar</button>
  </div>
</div>

<div id="modal-editar-perfil" class="modal-overlay">
  <div class="modal">
    <input type="text" placeholder="Nome">
    <textarea placeholder="Bio"></textarea>
    <input type="file">
    <div class="preview"></div>
    <button>Cancelar</button>
    <button>Salvar</button>
  </div>
</div>

<div id="modal-user-perfil" class="modal-overlay">
  <div class="modal">
    <div class="banner"></div>
    <img class="avatar">
    <div class="info"></div>
    <button>Seguir</button>
  </div>
</div>

<div id="modal-desafio-play" class="modal-overlay">
  <div class="modal">
    <h3>Título</h3>
    <div class="questoes"></div>
  </div>
</div>

<div id="modal-evento" class="modal-overlay">
  <div class="modal">
    <input type="text" placeholder="Título">
    <input type="date">
    <input type="time">
    <select>
      <option>Prova</option>
      <option>Estudo</option>
    </select>
    <input type="text" placeholder="Disciplina">
    <button>Cancelar</button>
    <button>Salvar</button>
  </div>
</div>

<div id="modal-tarefa" class="modal-overlay">
  <div class="modal">
    <input type="text" placeholder="Título">
    <select>
      <option>Baixa</option>
      <option>Média</option>
      <option>Alta</option>
    </select>
    <input type="date">
    <button>Cancelar</button>
    <button>Salvar</button>
  </div>
</div>

<div id="modal-pdf-preview" class="modal-overlay">
  <div class="modal">
    <div id="pdf-preview"></div>
    <button>Baixar</button>
  </div>
</div>

<!-- Firebase -->
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

<!-- JS -->
<script src="script.js"></script>

</body>
</html>
