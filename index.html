<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sexta-Feira Studies</title>
    <link rel="icon" href="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png">
    
    <!-- Google Fonts: Sora -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
    
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- CSS Customizado -->
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Loading Screen -->
    <div id="loading-screen" class="loading-overlay">
        <div class="spinner"></div>
    </div>

    <!-- Auth Section -->
    <div id="auth-section" class="screen">
        <div class="auth-container card">
            <img src="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png" alt="Logo" class="auth-logo">
            <h1 class="text-primary">Sexta-Feira Studies</h1>
            <p>Sua jornada gamificada começa aqui.</p>
            
            <div id="login-form">
                <div class="input-group">
                    <i class="fa fa-at"></i>
                    <input type="text" id="login-username" placeholder="Usuário ou Email">
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="login-password" placeholder="Senha">
                </div>
                <button onclick="handleLogin()" class="btn btn-primary w-full">Entrar</button>
                <p class="auth-switch">Não tem conta? <a href="#" onclick="switchAuth('signup')">Cadastre-se</a></p>
                <hr>
                <button onclick="handleGoogleLogin()" class="btn btn-google w-full">
                    <img src="https://www.gstatic.com/firebasejs/ui/2.0.0/images/action/google.svg" width="18"> Entrar com Google
                </button>
            </div>

            <div id="signup-form" class="hidden">
                <div class="input-group">
                    <i class="fa fa-user"></i>
                    <input type="text" id="signup-fullname" placeholder="Nome Completo">
                </div>
                <div class="input-group">
                    <i class="fa fa-at"></i>
                    <input type="text" id="signup-username" placeholder="Nome de Usuário (@)">
                </div>
                <div class="input-group">
                    <i class="fa fa-envelope"></i>
                    <input type="email" id="signup-email" placeholder="Email">
                </div>
                <div class="input-group">
                    <i class="fa fa-lock"></i>
                    <input type="password" id="signup-password" placeholder="Senha">
                </div>
                <button onclick="handleSignup()" class="btn btn-primary w-full">Criar Conta</button>
                <p class="auth-switch">Já tem conta? <a href="#" onclick="switchAuth('login')">Fazer Login</a></p>
            </div>
        </div>
    </div>

    <!-- Main App Layout -->
    <div id="app-section" class="hidden">
        
        <!-- Header -->
        <header class="main-header">
            <div class="header-left">
                <img src="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png" alt="Logo" class="mini-logo">
                <div class="search-bar">
                    <i class="fa fa-search"></i>
                    <input type="text" id="global-search" placeholder="Pesquisar..." onkeyup="handleSearch(this.value)">
                </div>
            </div>
            <div class="header-right">
                <div class="notification-icon" onclick="toggleNotifications()">
                    <i class="fa fa-bell"></i>
                    <span id="notif-badge" class="badge hidden">0</span>
                </div>
                <div class="user-pill" onclick="showSection('profile')">
                    <img id="header-avatar" src="https://via.placeholder.com/150" alt="Avatar">
                    <span id="header-name">Usuário</span>
                </div>
            </div>
        </header>

        <!-- Dynamic Content Area -->
        <main id="content-area" class="container">
            <!-- As seções serão injetadas via JS -->
        </main>

        <!-- Navigation Bar (Mobile First) -->
        <nav class="bottom-nav">
            <button class="nav-item active" onclick="showSection('home')">
                <i class="fa fa-house"></i>
                <span>Home</span>
            </button>
            <button class="nav-item" onclick="showSection('disciplinas')">
                <i class="fa fa-book"></i>
                <span>Estudos</span>
            </button>
            <button class="nav-item" onclick="showSection('feed')">
                <i class="fa fa-users"></i>
                <span>Feed</span>
            </button>
            <button class="nav-item" onclick="showSection('ranking')">
                <i class="fa fa-trophy"></i>
                <span>Ranking</span>
            </button>
            <button class="nav-item btn-jarvis-nav" onclick="showSection('jarvis')">
                <i class="fa fa-robot"></i>
                <span>Jarvis</span>
            </button>
        </nav>

        <!-- Modals -->
        <div id="modal-container" class="modal-overlay hidden">
            <div class="modal-card">
                <div class="modal-header">
                    <h2 id="modal-title">Título</h2>
                    <button class="btn-close" onclick="closeModal()"><i class="fa fa-times"></i></button>
                </div>
                <div id="modal-content" class="modal-body"></div>
            </div>
        </div>

        <!-- Toast Notifications -->
        <div id="toast-container" class="toast-container"></div>
    </div>

    <!-- Firebase Scripts -->
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-firestore-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>

    <!-- JS Customizado -->
    <script src="script.js"></script>
</body>
</html>
