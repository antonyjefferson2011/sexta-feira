<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sexta-Feira Studies - Em Manutenção</title>
  <link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Sora', sans-serif;
      background: #0F172A;
      color: #F1F5F9;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 20px;
    }
    .container {
      max-width: 500px;
    }
    .logo {
      width: 120px;
      height: 120px;
      border-radius: 50%;
      margin-bottom: 30px;
      border: 3px solid #10B981;
    }
    h1 {
      font-size: 28px;
      color: #10B981;
      margin-bottom: 10px;
    }
    .emoji {
      font-size: 60px;
      margin-bottom: 20px;
    }
    p {
      color: #94A3B8;
      font-size: 16px;
      line-height: 1.6;
      margin-bottom: 10px;
    }
    .status {
      display: inline-block;
      background: #F59E0B;
      color: #000;
      padding: 6px 16px;
      border-radius: 20px;
      font-weight: 700;
      font-size: 14px;
      margin-bottom: 30px;
    }
    .footer-text {
      margin-top: 40px;
      font-size: 14px;
      color: #64748B;
    }
    .heart {
      color: #EF4444;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🚧</div>
    <img src="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png" alt="Logo" class="logo" />
    <h1>Sexta-Feira Studies</h1>
    <div class="status">🔄 EM MANUTENÇÃO</div>
    <p>Estamos trabalhando para trazer novidades incríveis!</p>
    <p>Nosso site voltará em breve com muitas funcionalidades novas.</p>
    <p style="margin-top:20px;font-size:14px">
      📚 Aulas • 🎮 Quizzes • 🏆 Ranking • 🤖 Jarvis IA<br>
      ⚔️ Desafios • 👥 Grupos • 📝 Flashcards • ⏱️ Pomodoro
    </p>
    <p class="footer-text">Feito com <span class="heart">❤️</span> por Sexta-Feira Studies</p>
  </div>
</body>
</html>
