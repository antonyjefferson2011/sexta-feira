<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sexta-Feira Studies</title>
    <link rel="icon" href="https://i.ibb.co/4nVtZpr2/Gemini-Generated-Image-vrc8thvrc8thvrc8.png">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="style.css">
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-auth-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-database-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/9.22.0/firebase-storage-compat.js"></script>
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body>
    <div id="app">
        <!-- Login Screen -->
        <div id="login-screen" class="screen active">
            <div class="login-container">
                <img src="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png" alt="Logo" class="login-logo">
                <h2>Sexta-Feira Studies</h2>
                <p class="login-subtitle">A rede social de estudos gamificada</p>
                
                <div id="login-form">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="login-username" placeholder="@usuario" autocomplete="username">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="login-password" placeholder="Senha">
                    </div>
                    <button onclick="fazerLogin()" class="btn-primary">Entrar</button>
                    <button onclick="loginComGoogle()" class="btn-google">
                        <i class="fab fa-google"></i> Entrar com Google
                    </button>
                    <p class="link-text">Não tem conta? <a href="#" onclick="mostrarRegistro()">Registre-se</a></p>
                </div>

                <div id="registro-form" style="display:none;">
                    <div class="input-group">
                        <i class="fas fa-user"></i>
                        <input type="text" id="reg-fullname" placeholder="Nome completo">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-at"></i>
                        <input type="text" id="reg-username" placeholder="@usuario">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-envelope"></i>
                        <input type="email" id="reg-email" placeholder="Email">
                    </div>
                    <div class="input-group">
                        <i class="fas fa-lock"></i>
                        <input type="password" id="reg-password" placeholder="Senha">
                    </div>
                    <button onclick="registrar()" class="btn-primary">Registrar</button>
                    <p class="link-text">Já tem conta? <a href="#" onclick="mostrarLogin()">Faça login</a></p>
                </div>
            </div>
        </div>

        <!-- Main App -->
        <div id="main-app" class="screen">
            <!-- Sidebar Desktop -->
            <nav id="sidebar">
                <div class="sidebar-header">
                    <img src="https://i.ibb.co/TqNkvPMT/Gemini-Generated-Image-vetlw0vetlw0vetl.png" alt="Logo" class="sidebar-logo">
                    <h3>SFS</h3>
                </div>
                <ul class="nav-menu">
                    <li onclick="navegar('home')" data-page="home"><i class="fas fa-home"></i> <span>Home</span></li>
                    <li onclick="navegar('materias')" data-page="materias"><i class="fas fa-book"></i> <span>Disciplinas</span></li>
                    <li onclick="navegar('ranking')" data-page="ranking"><i class="fas fa-trophy"></i> <span>Ranking</span></li>
                    <li onclick="navegar('desafios')" data-page="desafios"><i class="fas fa-flag"></i> <span>Desafios</span></li>
                    <li onclick="navegar('jarvis')" data-page="jarvis"><i class="fas fa-robot"></i> <span>Jarvis IA</span></li>
                    <li onclick="navegar('feed')" data-page="feed"><i class="fas fa-newspaper"></i> <span>Feed</span></li>
                    <li onclick="navegar('perfil')" data-page="perfil"><i class="fas fa-user-circle"></i> <span>Perfil</span></li>
                    <li onclick="navegar('sobre')" data-page="sobre"><i class="fas fa-info-circle"></i> <span>Sobre Nós</span></li>
                    <li onclick="navegar('updates')" data-page="updates"><i class="fas fa-sync-alt"></i> <span>Updates</span></li>
                </ul>
                <div class="sidebar-footer" id="sidebar-footer"></div>
            </nav>

            <!-- Main Content -->
            <main id="main-content">
                <div id="page-home" class="page active"></div>
                <div id="page-materias" class="page"></div>
                <div id="page-ranking" class="page"></div>
                <div id="page-desafios" class="page"></div>
                <div id="page-jarvis" class="page"></div>
                <div id="page-feed" class="page"></div>
                <div id="page-perfil" class="page"></div>
                <div id="page-sobre" class="page"></div>
                <div id="page-updates" class="page"></div>
                <div id="page-materia-detalhes" class="page"></div>
                <div id="page-aula" class="page"></div>
                <div id="page-quiz" class="page"></div>
            </main>
        </div>

        <!-- Bottom Nav Mobile -->
        <nav id="bottom-nav">
            <button onclick="navegar('home')" data-page="home"><i class="fas fa-home"></i></button>
            <button onclick="navegar('materias')" data-page="materias"><i class="fas fa-book"></i></button>
            <button onclick="navegar('ranking')" data-page="ranking"><i class="fas fa-trophy"></i></button>
            <button onclick="navegar('feed')" data-page="feed"><i class="fas fa-newspaper"></i></button>
            <button onclick="navegar('perfil')" data-page="perfil"><i class="fas fa-user-circle"></i></button>
        </nav>

        <!-- Toast Container -->
        <div id="toast-container"></div>
    </div>

    <script src="script.js?v=2"></script>
</body>
</html>
